name: Auto Build TUSU AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Official Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.5"

    - name: Build TUSU AI APK
      run: |
        mkdir -p app/src/main/java/com/akthecoder/tusuai/view
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "TusuAI"
        include ':app'
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.akthecoder.tusuai'
            compileSdk 34

            defaultConfig {
                applicationId "com.akthecoder.tusuai"
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "1.0.1"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
            <application
                android:allowBackup="true"
                android:label="TUSU AI"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Colors & Layout
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="bg_dark">#080B10</color>
            <color name="cyan_core">#00F0FF</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#080B10"
            android:padding="16dp">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="TUSU AI // v1.0.1 - BY AK THE CODER"
                android:textColor="#00F0FF"
                android:textSize="15sp"
                android:textStyle="bold" />

            <com.akthecoder.tusuai.view.JarvisCoreView
                android:id="@+id/jarvisCore"
                android:layout_width="140dp"
                android:layout_height="140dp"
                android:layout_gravity="center"
                android:layout_marginTop="12dp"
                android:layout_marginBottom="12dp" />

            <TextView
                android:id="@+id/tvStatus"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_gravity="center"
                android:text="ONLINE"
                android:textColor="#00E676"
                android:textStyle="bold"
                android:background="#151F33"
                android:paddingLeft="14dp"
                android:paddingRight="14dp"
                android:paddingTop="4dp"
                android:paddingBottom="4dp" />

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:layout_marginTop="10dp"
                android:layout_marginBottom="10dp">
                <TextView
                    android:id="@+id/tvLog"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textColor="#F1F5F9"
                    android:textSize="14sp"
                    android:lineSpacingExtra="3dp"
                    android:text="TUSU: Systems online. Ask me anything in English or বাংলা!\n" />
            </ScrollView>

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal">
                <Button
                    android:id="@+id/btnMic"
                    android:layout_width="wrap_content"
                    android:layout_height="48dp"
                    android:text="MIC" />
                <EditText
                    android:id="@+id/etInput"
                    android:layout_width="0dp"
                    android:layout_height="48dp"
                    android:layout_weight="1"
                    android:layout_marginLeft="6dp"
                    android:layout_marginRight="6dp"
                    android:background="#151F33"
                    android:hint="Type prompt..."
                    android:textColor="#F1F5F9"
                    android:textColorHint="#94A3B8"
                    android:paddingLeft="10dp"
                    android:paddingRight="10dp" />
                <Button
                    android:id="@+id/btnSend"
                    android:layout_width="wrap_content"
                    android:layout_height="48dp"
                    android:text="SEND" />
            </LinearLayout>
        </LinearLayout>
        EOF

        # 6. JarvisCoreView.java
        cat << 'EOF' > app/src/main/java/com/akthecoder/tusuai/view/JarvisCoreView.java
        package com.akthecoder.tusuai.view;

        import android.animation.ValueAnimator;
        import android.content.Context;
        import android.graphics.Canvas;
        import android.graphics.Color;
        import android.graphics.Paint;
        import android.graphics.RectF;
        import android.util.AttributeSet;
        import android.view.View;
        import android.view.animation.LinearInterpolator;

        public class JarvisCoreView extends View {
            private Paint ringPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
            private Paint arcPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
            private float rot = 0f;
            private RectF bounds = new RectF();

            public JarvisCoreView(Context c) {
                super(c);
                init();
            }

            public JarvisCoreView(Context c, AttributeSet a) {
                super(c, a);
                init();
            }

            private void init() {
                ringPaint.setStyle(Paint.Style.STROKE);
                ringPaint.setStrokeWidth(4f);
                ringPaint.setColor(Color.parseColor("#00F0FF"));
                arcPaint.setStyle(Paint.Style.STROKE);
                arcPaint.setStrokeWidth(7f);
                arcPaint.setColor(Color.parseColor("#0072FF"));

                ValueAnimator v = ValueAnimator.ofFloat(0f, 360f);
                v.setDuration(5000);
                v.setRepeatCount(ValueAnimator.INFINITE);
                v.setInterpolator(new LinearInterpolator());
                v.addUpdateListener(new ValueAnimator.AnimatorUpdateListener() {
                    @Override
                    public void onAnimationUpdate(ValueAnimator an) {
                        rot = (float) an.getAnimatedValue();
                        invalidate();
                    }
                });
                v.start();
            }

            @Override
            protected void onDraw(Canvas canvas) {
                super.onDraw(canvas);
                float cx = getWidth() / 2f;
                float cy = getHeight() / 2f;
                float r = Math.min(cx, cy) * 0.8f;
                if (r <= 0) return;
                bounds.set(cx - r, cy - r, cx + r, cy + r);
                canvas.drawCircle(cx, cy, r * 0.95f, ringPaint);
                canvas.save();
                canvas.rotate(rot, cx, cy);
                canvas.drawArc(bounds, 0, 80, false, arcPaint);
                canvas.drawArc(bounds, 180, 80, false, arcPaint);
                canvas.restore();
                canvas.drawCircle(cx, cy, 12f, ringPaint);
            }
        }
        EOF

        # 7. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/akthecoder/tusuai/MainActivity.java
        package com.akthecoder.tusuai;

        import android.Manifest;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.graphics.Color;
        import android.hardware.camera2.CameraManager;
        import android.os.Bundle;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.speech.tts.TextToSpeech;
        import android.view.View;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import java.util.ArrayList;
        import java.util.Locale;

        public class MainActivity extends AppCompatActivity {
            private TextView tvStatus, tvLog;
            private EditText etInput;
            private TextToSpeech tts;
            private SpeechRecognizer rec;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                tvStatus = findViewById(R.id.tvStatus);
                tvLog = findViewById(R.id.tvLog);
                etInput = findViewById(R.id.etInput);

                tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                    @Override
                    public void onInit(int status) {
                        if (status == TextToSpeech.SUCCESS) {
                            tts.setLanguage(Locale.US);
                        }
                    }
                });

                Button btnSend = findViewById(R.id.btnSend);
                btnSend.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        String q = etInput.getText().toString().trim();
                        if (!q.isEmpty()) {
                            handleQuery(q);
                            etInput.setText("");
                        }
                    }
                });

                Button btnMic = findViewById(R.id.btnMic);
                btnMic.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                            ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                        } else {
                            listen();
                        }
                    }
                });
            }

            private void handleQuery(String q) {
                tvLog.append("\nYou: " + q);
                String l = q.toLowerCase();
                if (l.contains("flashlight on") || l.contains("টর্চ জ্বালাও")) {
                    toggleFlash(true);
                    reply("Flashlight turned on, sir.");
                } else if (l.contains("flashlight off") || l.contains("টর্চ বন্ধ করো")) {
                    toggleFlash(false);
                    reply("Flashlight turned off.");
                } else {
                    reply("TUSU: I hear you loud and clear. Systems ready for action!");
                }
            }

            private void reply(String msg) {
                tvLog.append("\nTUSU: " + msg + "\n");
                boolean bn = false;
                for (char c : msg.toCharArray()) {
                    if (Character.UnicodeBlock.of(c) == Character.UnicodeBlock.BENGALI) {
                        bn = true;
                        break;
                    }
                }
                if (bn) {
                    tts.setLanguage(new Locale("bn", "BD"));
                } else {
                    tts.setLanguage(Locale.US);
                }
                tts.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "ID");
            }

            private void listen() {
                rec = SpeechRecognizer.createSpeechRecognizer(this);
                Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                rec.setRecognitionListener(new RecognitionListener() {
                    @Override
                    public void onReadyForSpeech(Bundle b) {
                        tvStatus.setText("LISTENING");
                        tvStatus.setTextColor(Color.parseColor("#00F0FF"));
                    }
                    @Override
                    public void onResults(Bundle b) {
                        ArrayList<String> m = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                        tvStatus.setText("ONLINE");
                        tvStatus.setTextColor(Color.parseColor("#00E676"));
                        if (m != null && !m.isEmpty()) {
                            handleQuery(m.get(0));
                        }
                    }
                    @Override
                    public void onError(int e) {
                        tvStatus.setText("ONLINE");
                        tvStatus.setTextColor(Color.parseColor("#00E676"));
                    }
                    @Override public void onBeginningOfSpeech() {}
                    @Override public void onRmsChanged(float v) {}
                    @Override public void onBufferReceived(byte[] b) {}
                    @Override public void onEndOfSpeech() {}
                    @Override public void onPartialResults(Bundle b) {}
                    @Override public void onEvent(int t, Bundle b) {}
                });
                rec.startListening(i);
            }

            private void toggleFlash(boolean on) {
                try {
                    CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                    if (cm != null && cm.getCameraIdList().length > 0) {
                        cm.setTorchMode(cm.getCameraIdList()[0], on);
                    }
                } catch (Exception ignored) {}
            }
        }
        EOF

        # 8. Compile APK
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TUSU-AI-1.0.1-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
